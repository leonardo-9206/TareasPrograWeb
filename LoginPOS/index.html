<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocerQuick POS - Iniciar Sesión</title>
    <!-- para fonts diferentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-wrapper">
        <div class="login-card">
            <!-- encabezado -->
            <header class="login-header">
                <div class="brand-badge">POS</div>
                <h1 class="brand-title">GrocerQuick</h1>
                <p class="brand-subtitle">Sistema de Punto de Venta</p>
            </header>

            <!-- novalidate para quitar animacion -->
            <form class="login-form" action="#" method="POST" novalidate>
                <div class="form-group">
                    <label for="username">Usuario / Matrícula</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Ej. cajero01 o UAA123" 
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-login">
                    Iniciar Sesión
                </button>
            </form>

            <footer class="login-footer">
                <p>¿Necesitas ayuda? Contacta a soporte en <strong>correo@soporteLeo.mx</strong></p>
                <span class="version-tag">v2.4 Ártico</span>
            </footer>
        </div>
    </main>
</body>
</html>
